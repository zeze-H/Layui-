<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./layui-v2.13.9/layui/css/layui.css">
</head>
<body>
    <ul class="layui-nav">
        <li class="layui-nav-item layui-this"><a href="javascript:;">概览</a></li>
        <li class="layui-nav-item"><a href="javascript:;">学生管理</a></li>
        <li class="layui-nav-item"><a href="javascript:;">考勤</a></li>
    </ul>
    
    <div class="layui-container">
        <h1>学生信息录入</h1>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-xs12 layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">班级概况</div>
                    <div class="layui-card-body">学生总数:45</div>
                </div>
            </div>
            <div class="layui-col-xs12 layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">新增学生</div>
                    <div class="layui-card-body">
                        <form class="layui-form">
                            <div class="layui-form-item">
                                <label for="studentName" class="layui-form-label">学生姓名</label>
                                <div class="layui-input-block">
                                    <input 
                                    type="text"
                                    name="studentName"
                                    id="studentName"
                                    class="layui-input"
                                    placeholder="请输入学生姓名"
                                    lay-verify="required"
                                    >
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label for="studentNum" class="layui-form-label">学生学号</label>
                                <div class="layui-input-block">
                                    <input 
                                    type="text"
                                    name="studentNum"
                                    id="studentNum"
                                    class="layui-input"
                                    placeholder="请输入学生学号"
                                    lay-verify="required"
                                    >
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label for="studentGender" class="layui-form-label">性别</label>
                                <div class="layui-input-block">
                                    <select name="studentGender" id="studentGender" lay-verify="required">
                                        <option value="">请选择学生性别</option>
                                        <option value="male">男</option>
                                        <option value="female">女</option>
                                    </select>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" type="button" id="SM">查看填写说明</button>
                                    <button class="layui-btn" type="submit" lay-submit lay-filter="studentInfo">保存学生</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./layui-v2.13.9/layui/layui.js"></script>
    <script>
        layui.use(["element","form","layer"],function(){
            const element=layui.element;
            const form=layui.form;
            const layer=layui.layer;

            form.render();

            const helpButton = document.querySelector("#SM");
            helpButton.addEventListener("click",function(){
                layer.msg("姓名,性别,学号,都要填写");
            });

            function studentInfo(data){
                console.log(data.field);
                layer.msg("登记成功");
                return false;
            }
            form.on("submit(studentInfo)",studentInfo);
        });
        
    </script>
</body>
</html>
